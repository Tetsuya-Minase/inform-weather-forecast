name: inform-weather-confirm-flow

on:
  pull_request:
    branches:
      - '*'

jobs:
  check_pull_request:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: setup
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: install
        run: npm ci

      - name: lint
        run: npm run lint:format

      - name: test
        run: npm test

      - name: build
        run: npm run build
